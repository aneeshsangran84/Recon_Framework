[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-framework"
version = "0.1.0"
description = "Enterprise Reconnaissance Framework for authorized assessments"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "Recon Framework Team"}]
keywords = ["reconnaissance", "security", "pentest", "osint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "httpx>=0.25",
    "tenacity>=8.0",
    "dnspython>=2.4",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "tomli>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
full = ["python-whois", "geoip2", "weasyprint"]
dev = ["pytest", "pytest-asyncio", "black", "ruff", "mypy"]

[project.scripts]
recon = "recon.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
